name: link-check

on:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # No --depth: checkout already fetched full history, and a shallow
            # fetch grafts a boundary onto the complete clone, so the three-dot
            # diff below dies with "no merge base" as soon as the base branch
            # moves ahead of the PR's fork point. Keep the diff on its own line
            # too — folding it into the grep pipeline let `|| true` swallow that
            # fatal, which read as "nothing changed" and passed the job having
            # checked zero links.
            git fetch origin "${BASE_REF}"
            diff_out=$(git diff --name-only --diff-filter=AMR "origin/${BASE_REF}"...HEAD)
            changed=$(printf '%s\n' "$diff_out" \
              | grep -E '\.(rst|md|py)$' \
              | grep -vE '^\.github/' \
              || true)
            if [[ -z "$changed" ]]; then
              echo "files=" >> "$GITHUB_OUTPUT"
              echo "No documentation files (.rst/.md/.py outside .github/) changed in this PR; skipping link check."
            else
              echo "files<<EOF" >> "$GITHUB_OUTPUT"
              echo "$changed" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
            fi
          else
            { echo "files<<EOF"; find . -type f \( -name '*.rst' -o -name '*.md' -o -name '*.py' \) \
              -not -path './.git/*' -not -path './venv/*' -not -path './*/venv*/*' \
              -not -path './.github/*'; echo EOF; } >> "$GITHUB_OUTPUT"
          fi

      - name: Lychee
        if: steps.scope.outputs.files != ''
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # No --accept: passing a list REPLACES lychee's default 100..=103 and
          # 200..=299 rather than extending it. `--accept 200,206,429` accepted a
          # throttled 429 as a valid link while rejecting ordinary 201 and 204.
          # --max-retries and --timeout are left at their defaults (3 and 20s);
          # the previous 2 retries was below default and made 429s more likely
          # to surface, not less.
          #
          # cppreference.com and stackoverflow.com are excluded for the same
          # reason as man7.org: the URLs are good, but the hosts answer 403 to a
          # non-browser client, so checking them only ever produces false
          # failures. cppreference serves 200 to an ordinary client and 403 to
          # the runner; stackoverflow 403s every non-browser client outright.
          #
          # docs/plans/** holds point-in-time planning documents. Their links are
          # correct as of the date in the filename and rot as the tree moves --
          # e.g. d9ef658 renamed _c.py to libc.py, breaking links that were right
          # when written. Chasing that is churn, and extract_codeblocks.py already
          # skips 'plans' for the same reason.
          args: >-
            --no-progress
            --max-concurrency 4
            --retry-wait-time 5
            --exclude '^mailto:'
            --exclude 'man7\.org'
            --exclude 'cppreference\.com'
            --exclude 'stackoverflow\.com'
            --exclude-path .git
            --exclude-path venv
            --exclude-path docs/plans
            ${{ steps.scope.outputs.files }}
          fail: true
          # Don't fail when the changed-file set contains no links at all
          # (e.g. a code-only or link-less-docs PR): "no links found" is not a
          # link-check failure. Broken links are still reported via fail: true.
          failIfEmpty: false
          format: markdown
          output: ./lychee-report.md

      - name: Upload report
        if: always() && steps.scope.outputs.files != ''
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report
          path: lychee-report.md
          if-no-files-found: ignore
