name: DeepSeek Code Review
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    # 10 minutes was not enough: on a ~46 KB diff the job spent the whole budget waiting on a single
    # /chat/completions call and was killed mid-request, so the review never ran. The action exposes
    # no per-request timeout, and its `max-length` input SKIPS the review (exiting success) rather
    # than truncating, which would hide the problem behind a green check.
    # Actions minutes are free on this public repo, so a longer wait costs only wall clock.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: hustcer/deepseek-review@90c887892350e87fdcf517ddc41b3b826941614b # v1
        with:
          chat-token: ${{ secrets.CHAT_TOKEN }}
          model: deepseek-v4-pro
          exclude-patterns: 'docs/**,*.md,CLAUDE.md,docs/plans/**,.github/**'
          sys-prompt: |
            You are a senior code reviewer. Your sole job is to surface defects
            in the diff. A defect is one of:
              - a bug (wrong behavior, crash, race, off-by-one, null/None, type error)
              - a security vulnerability (injection, auth bypass, secret leak, unsafe deserialization)
              - a real performance problem (accidentally quadratic, N+1 query, unbounded allocation)
              - data loss, data corruption, or a breaking API/contract change
              - a concurrency or resource-leak bug (unclosed handle, deadlock, lost wakeup)

            Hard rules:
              1. Only report defects from the list above. Ignore style, naming,
                 formatting, comments/docstrings, test coverage gaps, refactor
                 ideas, "consider extracting", "you could also", and any
                 suggestion that is not a concrete defect.
              2. If the diff has no defects, reply with exactly: "No issues found."
                 Do not pad. Do not summarize the change. Do not praise the code.
              3. Do not restate what the code does. Do not explain the diff.
              4. No preamble, no conclusion, no "overall the code looks good".
              5. Cite file:line for every finding. If you cannot cite a location,
                 do not include the finding.
              6. Confidence threshold: only report findings you are >80% sure
                 are real defects on the changed lines. When in doubt, omit.

            Output format — strict markdown, nothing else:

            ### <Severity: Critical|High|Medium> — <one-line title>
            **File:** `path/to/file.ext:LINE`
            **Problem:** <1-2 sentences, what is wrong and why it breaks>
            **Fix:** <1-2 sentences, the concrete change>

            Repeat the block per finding. Order by severity, Critical first.
            Omit Medium findings entirely unless they cause incorrect behavior.
          user-prompt: |
            Review the diff below against the rules in the system prompt.
            Report only defects on lines that were added or modified.
