name: DeepSeek Code Review
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    # Without this the job starts on a pull request whose every changed file is
    # excluded below, `exclude-patterns` reduces the diff to nothing, and the
    # action sends the empty diff to the model regardless: its log reads
    # "Review content length: 0" against a 432 token prompt, which is the system
    # prompt alone. The model is still bound by the strict output format, so it
    # fills the format with invented findings. Both numbox#105 and numbox#106
    # drew a review citing paths this repository has never contained, each one
    # assembled from the defect categories listed in the system prompt. The same
    # action on a real diff sent 41 KB and cited a real file and line, so the
    # model is not at fault and there is no empty-diff guard in the action to
    # turn on. Not running is the guard.
    #
    # Keeping this "in step with `exclude-patterns`" is not a matter of copying
    # the list across: the two dialects differ, and the action's is stranger
    # than it looks. It joins the patterns into ONE awk regex, but the grouping
    # parentheses in its own source are nushell interpolation and never reach
    # awk, so the alternation binds at the top level and ONLY THE FIRST PATTERN
    # carries the `^diff --git a/` anchor. Every later pattern matches at any
    # depth. Verified against the pinned action by replaying its regex over a
    # real diff.
    #
    # The ORDER of `exclude-patterns` is therefore significant:
    #   `docs/**` is FIRST, so it stays root-anchored and agrees with the
    #   root-anchored `docs/**` here. KEEP IT FIRST. Demote it and it starts
    #   excluding a nested `docs/` that GitHub will not skip, which is an empty
    #   diff and an invented review.
    #   `.github/**` is not first, so it matches `.github/` at ANY depth.
    #   This repository has no nested `.github/`, so the single entry below
    #   suffices; add `**/.github/**` if one is ever introduced.
    #
    # Drift is otherwise asymmetric: too narrow here and an empty diff reaches
    # the model again; too broad and a reviewable pull request is skipped in
    # silence. A pull request that also touches something reviewable still
    # runs, and `exclude-patterns` strips the rest from its diff.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    # 10 minutes was not enough: on a ~46 KB diff the job spent the whole budget waiting on a single
    # /chat/completions call and was killed mid-request, so the review never ran. The action exposes
    # no per-request timeout, and its `max-length` input SKIPS the review (exiting success) rather
    # than truncating, which would hide the problem behind a green check.
    # Actions minutes are free on this public repo, so a longer wait costs only wall clock.
    #
    # Restricted to same-repo pull requests. `pull_request_target` fires for a pull request from
    # a fork too, and nothing gates the author: the action's own `allowed-associations` check runs
    # only on its `issue_comment` path, and its review script has no fork or association check at
    # all, so a fork pull request would spend the paid CHAT_TOKEN. The action never checks out the
    # head, so this guards cost and noise rather than code execution.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `secrets` is not available in a job-level `if`, so the presence check is hoisted here and
      # applied to the step instead. Without a token the action exits INVALID_PARAMETER and posts
      # a "provide your token" comment on every pull request; skipping is silent.
      HAS_CHAT_TOKEN: ${{ secrets.CHAT_TOKEN != '' }}
    steps:
      - if: env.HAS_CHAT_TOKEN == 'true'
        uses: hustcer/deepseek-review@eccde2e9781008d795e366b951e313e37af88dd5 # v1.21
        with:
          chat-token: ${{ secrets.CHAT_TOKEN }}
          model: deepseek-v4-pro
          exclude-patterns: 'docs/**,*.md,CLAUDE.md,docs/plans/**,.github/**'
          sys-prompt: |
            You are a senior code reviewer. Your sole job is to surface defects
            in the diff. A defect is one of:
              - a bug (wrong behavior, crash, race, off-by-one, null/None, type error)
              - a security vulnerability (injection, auth bypass, secret leak, unsafe deserialization)
              - a real performance problem (accidentally quadratic, N+1 query, unbounded allocation)
              - data loss, data corruption, or a breaking API/contract change
              - a concurrency or resource-leak bug (unclosed handle, deadlock, lost wakeup)

            Hard rules:
              1. Only report defects from the list above. Ignore style, naming,
                 formatting, comments/docstrings, test coverage gaps, refactor
                 ideas, "consider extracting", "you could also", and any
                 suggestion that is not a concrete defect.
              2. If the diff has no defects, reply with exactly: "No issues found."
                 Do not pad. Do not summarize the change. Do not praise the code.
              3. Do not restate what the code does. Do not explain the diff.
              4. No preamble, no conclusion, no "overall the code looks good".
              5. Cite file:line for every finding. If you cannot cite a location,
                 do not include the finding.
              6. Confidence threshold: only report findings you are >80% sure
                 are real defects on the changed lines. When in doubt, omit.

            Output format — strict markdown, nothing else:

            ### <Severity: Critical|High|Medium> — <one-line title>
            **File:** `path/to/file.ext:LINE`
            **Problem:** <1-2 sentences, what is wrong and why it breaks>
            **Fix:** <1-2 sentences, the concrete change>

            Repeat the block per finding. Order by severity, Critical first.
            Omit Medium findings entirely unless they cause incorrect behavior.
          user-prompt: |
            Review the diff below against the rules in the system prompt.
            Report only defects on lines that were added or modified.
