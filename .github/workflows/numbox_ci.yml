name: numbox_ci

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        numba-version: [ "0.65.1" ]
        arch: [ "ubuntu-latest", "ubuntu-24.04-arm", "windows-latest" ]
        exclude:
          - arch: "windows-latest"
            python-version: "3.11"
          - arch: "windows-latest"
            python-version: "3.12"
          - arch: "windows-latest"
            python-version: "3.13"
        include:
          # min numba for 3.10-3.12 (0.60.0)
          - python-version: "3.10"
            numba-version: "0.60.0"
            arch: "ubuntu-latest"
          - python-version: "3.10"
            numba-version: "0.60.0"
            arch: "ubuntu-24.04-arm"
          - python-version: "3.10"
            numba-version: "0.60.0"
            arch: "windows-latest"
          - python-version: "3.11"
            numba-version: "0.60.0"
            arch: "ubuntu-latest"
          - python-version: "3.11"
            numba-version: "0.60.0"
            arch: "ubuntu-24.04-arm"
          - python-version: "3.12"
            numba-version: "0.60.0"
            arch: "ubuntu-latest"
          - python-version: "3.12"
            numba-version: "0.60.0"
            arch: "ubuntu-24.04-arm"
          # min numba for 3.13 (0.61.0)
          - python-version: "3.13"
            numba-version: "0.61.0"
            arch: "ubuntu-latest"
          - python-version: "3.13"
            numba-version: "0.61.0"
            arch: "ubuntu-24.04-arm"
          # min numba for 3.14 (0.63.0)
          - python-version: "3.14"
            numba-version: "0.63.0"
            arch: "ubuntu-latest"
          - python-version: "3.14"
            numba-version: "0.63.0"
            arch: "ubuntu-24.04-arm"
          - python-version: "3.14"
            numba-version: "0.63.0"
            arch: "windows-latest"
          # macOS
          - python-version: "3.14"
            numba-version: "0.65.1"
            arch: "macos-latest"
    runs-on: "${{ matrix.arch }}"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Determine version
      shell: bash
      id: version
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          BUILD_VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
        fi
    - name: Write version to __init__.py
      shell: bash
      run: echo "__version__ = '${{ env.VERSION }}'" > numbox/__init__.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        pip install "numba==${{ matrix.numba-version }}"
        pip install -e .
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors, undefined names, or unused imports
        flake8 . --count --exclude=test/core/random_image_ref.py --select=E9,F63,F7,F82,F401 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest --durations=20 --cov=numbox --cov-report=term-missing
    - name: Install build dependencies
      run: |
        pip install build==1.2.2.post1 wheel==0.45.0
    - name: Build wheel
      run: |
        git clean -Xfd
        python -m build --wheel

  musl_symbol_check:
    # Verifies the claims made in numbox/core/bindings/_strerror.py's module
    # docstring about how strerror_r and __xpg_strerror_r are exported on musl:
    #   1. musl exports strerror_r (the POSIX XSI implementation)
    #   2. musl ALSO exports __xpg_strerror_r as a weak alias to strerror_r
    #   3. Both symbols resolve to the same address (i.e. same function body)
    # This is what makes _select_posix_symbol's "__xpg_strerror_r first" probe
    # correct on both glibc and musl, and makes the strerror_r fallback in
    # that selector currently-unreachable defense-in-depth.
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20
    permissions:
      contents: read
    steps:
      - name: musl symbol layout + __xpg_strerror_r weak-alias equivalence
        shell: sh
        run: |
          apk add --no-cache binutils
          test -e /lib/ld-musl-x86_64.so.1 || (echo "no musl on this image"; exit 1)
          LIBC=/lib/ld-musl-x86_64.so.1
          STRERROR_ADDR=$(nm -D "$LIBC" | awk '/^[0-9a-f]+ [TW] strerror_r$/ {print $1}')
          XPG_ADDR=$(nm -D "$LIBC" | awk '/^[0-9a-f]+ [TW] __xpg_strerror_r$/ {print $1}')
          test -n "$STRERROR_ADDR" || (echo "musl strerror_r missing"; exit 1)
          test -n "$XPG_ADDR" || (echo "musl __xpg_strerror_r missing — _strerror.py's docstring claim about the weak alias is wrong"; exit 1)
          if [ "$STRERROR_ADDR" != "$XPG_ADDR" ]; then
            echo "musl strerror_r ($STRERROR_ADDR) and __xpg_strerror_r ($XPG_ADDR) resolve to different addresses — weak-alias assumption broken"
            exit 1
          fi
          echo "musl libc: strerror_r and __xpg_strerror_r both at $STRERROR_ADDR (weak alias holds)"
