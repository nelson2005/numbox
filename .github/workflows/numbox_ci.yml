name: numbox_ci

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        # DEBUG: Homebrew-only — reproduce Goykhman's scenario
        include:
          - python-version: "3.14"
            numba-version: "0.65.1"
            arch: "macos-latest"
            python-source: "homebrew"
    runs-on: "${{ matrix.arch }}"

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python (framework)
      if: matrix.python-source != 'homebrew'
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Set up Python (Homebrew)
      if: matrix.python-source == 'homebrew'
      run: |
        brew install python@${{ matrix.python-version }}
        brew link --overwrite python@${{ matrix.python-version }}
        echo "/opt/homebrew/opt/python@${{ matrix.python-version }}/libexec/bin" >> $GITHUB_PATH
        echo "/opt/homebrew/opt/python@${{ matrix.python-version }}/bin" >> $GITHUB_PATH
    - name: Verify Homebrew Python
      if: matrix.python-source == 'homebrew'
      run: |
        which python3
        python3 -c "import sys; print(sys.executable)"
        python3 -c "import _sqlite3; print(_sqlite3.__file__)"
    - name: Determine version
      shell: bash
      id: version
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          BUILD_VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
        fi
    - name: Write version to __init__.py
      shell: bash
      run: echo "__version__ = '${{ env.VERSION }}'" > numbox/__init__.py
    - name: Create venv (Homebrew)
      if: matrix.python-source == 'homebrew'
      run: |
        python3 -m venv venv
        echo "$PWD/venv/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        pip install "numba==${{ matrix.numba-version }}"
        pip install -e .
    - name: Reproduce Goykhman scenario (macOS, no pybridge)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        python3 -u -c "
        import ctypes, ctypes.util, os, subprocess, sys, sqlite3
        F = sys.stdout.flush
        import _sqlite3
        print(f'python: {sys.executable}'); F()
        print(f'_sqlite3: {_sqlite3.__file__}'); F()
        subprocess.run(['otool', '-L', _sqlite3.__file__]); F()
        path = ctypes.util.find_library('sqlite3')
        print(f'find_library: {path!r}'); F()
        print(); F()
        print('--- step 1: load_lib scenario (RTLD_GLOBAL on find_library result) ---'); F()
        lib = ctypes.CDLL(path, mode=os.RTLD_GLOBAL)
        from llvmlite import binding as ll
        for name in ['sqlite3_open', 'sqlite3_errmsg', 'sqlite3_changes']:
            addr = ll.address_of_symbol(name)
            print(f'  address_of_symbol({name}): {addr:#x}' if addr else f'  address_of_symbol({name}): None'); F()
        print(); F()
        print('--- step 2: open connection via Python stdlib ---'); F()
        conn = sqlite3.connect(':memory:')
        conn.execute('CREATE TABLE t(x INT)')
        conn.execute('INSERT INTO t VALUES (42)')
        conn.commit()
        print(f'  Python sqlite3.sqlite_version: {sqlite3.sqlite_version}'); F()
        print(); F()
        print('--- step 3: extract connection pointer ---'); F()
        from numbox.utils.pysqlite_bridge import _PysqliteConnection
        db_ptr = _PysqliteConnection.from_address(id(conn)).db
        print(f'  db_ptr: {db_ptr:#x}'); F()
        print(); F()
        print('--- step 4: call system sqlite functions on Python connection ptr ---'); F()
        print('  calling sqlite3_changes...'); F()
        lib.sqlite3_changes.restype = ctypes.c_int
        lib.sqlite3_changes.argtypes = [ctypes.c_void_p]
        result = lib.sqlite3_changes(db_ptr)
        print(f'  sqlite3_changes(db_ptr) = {result}'); F()
        print('  calling sqlite3_errmsg...'); F()
        lib.sqlite3_errmsg.restype = ctypes.c_char_p
        lib.sqlite3_errmsg.argtypes = [ctypes.c_void_p]
        msg = lib.sqlite3_errmsg(db_ptr)
        print(f'  sqlite3_errmsg(db_ptr) = {msg}'); F()
        print(); F()
        print('--- step 5: version comparison ---'); F()
        lib.sqlite3_libversion.restype = ctypes.c_char_p
        lib.sqlite3_libversion.argtypes = []
        sys_ver = lib.sqlite3_libversion()
        print(f'  system (find_library): {sys_ver}'); F()
        print(f'  Python (stdlib):       {sqlite3.sqlite_version}'); F()
        print(f'  match: {sys_ver.decode() == sqlite3.sqlite_version}'); F()
        conn.close()
        " || true
    - name: Lint with flake8
      run: flake8 . --count --show-source --statistics
    - name: Test with pytest
      run: |
        pytest --durations=20 --cov=numbox --cov-report=term-missing
    - name: Install build dependencies
      run: |
        pip install build==1.2.2.post1 wheel==0.45.0
    - name: Build wheel
      run: |
        git clean -Xfd
        python -m build --wheel
