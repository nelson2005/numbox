name: numbox_ci

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        # DEBUG: macOS-only — restore full matrix after diagnostic
        include:
          # macOS — python.org framework build (static sqlite)
          - python-version: "3.14"
            numba-version: "0.65.1"
            arch: "macos-latest"
            python-source: "framework"
          # macOS — Homebrew build (dynamic sqlite)
          - python-version: "3.14"
            numba-version: "0.65.1"
            arch: "macos-latest"
            python-source: "homebrew"
    runs-on: "${{ matrix.arch }}"

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python (framework)
      if: matrix.python-source != 'homebrew'
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Set up Python (Homebrew)
      if: matrix.python-source == 'homebrew'
      run: |
        brew install python@${{ matrix.python-version }}
        brew link --overwrite python@${{ matrix.python-version }}
        echo "/opt/homebrew/opt/python@${{ matrix.python-version }}/libexec/bin" >> $GITHUB_PATH
        echo "/opt/homebrew/opt/python@${{ matrix.python-version }}/bin" >> $GITHUB_PATH
    - name: Verify Homebrew Python
      if: matrix.python-source == 'homebrew'
      run: |
        which python3
        python3 -c "import sys; print(sys.executable)"
        python3 -c "import _sqlite3; print(_sqlite3.__file__)"
    - name: Determine version
      shell: bash
      id: version
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          BUILD_VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
        fi
    - name: Write version to __init__.py
      shell: bash
      run: echo "__version__ = '${{ env.VERSION }}'" > numbox/__init__.py
    - name: Create venv (Homebrew)
      if: matrix.python-source == 'homebrew'
      run: |
        python3 -m venv venv
        echo "$PWD/venv/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        pip install "numba==${{ matrix.numba-version }}"
        pip install -e .
    - name: SQLite library diagnostic (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        python3 -u -c "
        import ctypes, ctypes.util, sys, subprocess, os
        F = sys.stdout.flush
        print('=== Python build ==='); F()
        print(f'executable: {sys.executable}'); F()
        import _sqlite3
        print(f'_sqlite3: {_sqlite3.__file__}'); F()
        subprocess.run(['otool', '-L', _sqlite3.__file__])
        F()
        path = ctypes.util.find_library('sqlite3')
        print(f'find_library: {path!r}'); F()
        lib_find = ctypes.CDLL(path, mode=os.RTLD_GLOBAL)
        lib_ext = ctypes.CDLL(_sqlite3.__file__, mode=os.RTLD_GLOBAL)
        print(f'handle find_library: {lib_find._handle:#x}'); F()
        print(f'handle _sqlite3.so: {lib_ext._handle:#x}'); F()
        for name in ['sqlite3_open', 'sqlite3_errmsg', 'sqlite3_changes']:
            f1 = getattr(lib_find, name, None)
            f2 = getattr(lib_ext, name, None)
            a1 = ctypes.cast(f1, ctypes.c_void_p).value if f1 else None
            a2 = ctypes.cast(f2, ctypes.c_void_p).value if f2 else None
            tag = 'SAME' if a1 == a2 else 'DIFFERENT'
            s1 = f'{a1:#x}' if a1 else 'None'
            s2 = f'{a2:#x}' if a2 else 'None'
            print(f'{name}: find={s1} ext={s2} [{tag}]'); F()
        from llvmlite import binding as ll
        for name in ['sqlite3_open', 'sqlite3_errmsg', 'sqlite3_changes']:
            addr = ll.address_of_symbol(name)
            print(f'dlsym {name}: {addr:#x}' if addr else f'dlsym {name}: None'); F()
        "
    - name: Lint with flake8
      run: flake8 . --count --show-source --statistics
    - name: Test with pytest
      run: |
        pytest --durations=20 --cov=numbox --cov-report=term-missing
    - name: Install build dependencies
      run: |
        pip install build==1.2.2.post1 wheel==0.45.0
    - name: Build wheel
      run: |
        git clean -Xfd
        python -m build --wheel
