name: numbox_ci

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        # DEBUG: macOS-only — restore full matrix after diagnostic
        include:
          # macOS — python.org framework build (static sqlite)
          - python-version: "3.14"
            numba-version: "0.65.1"
            arch: "macos-latest"
            python-source: "framework"
          # macOS — Homebrew build (dynamic sqlite)
          - python-version: "3.14"
            numba-version: "0.65.1"
            arch: "macos-latest"
            python-source: "homebrew"
    runs-on: "${{ matrix.arch }}"

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python (framework)
      if: matrix.python-source != 'homebrew'
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Set up Python (Homebrew)
      if: matrix.python-source == 'homebrew'
      run: |
        brew install python@${{ matrix.python-version }}
        brew link --overwrite python@${{ matrix.python-version }}
        echo "/opt/homebrew/opt/python@${{ matrix.python-version }}/bin" >> $GITHUB_PATH
    - name: Determine version
      shell: bash
      id: version
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          BUILD_VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
        fi
    - name: Write version to __init__.py
      shell: bash
      run: echo "__version__ = '${{ env.VERSION }}'" > numbox/__init__.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        pip install "numba==${{ matrix.numba-version }}"
        pip install -e .
    - name: SQLite library diagnostic (macOS)
      if: runner.os == 'macOS'
      run: |
        python -c "
        import ctypes, ctypes.util, sys, subprocess
        print('=== Python build ===')
        print(f'executable: {sys.executable}')
        print(f'_sqlite3 location:')
        import _sqlite3
        print(f'  {_sqlite3.__file__}')
        print()
        print('=== otool -L _sqlite3.so ===')
        subprocess.run(['otool', '-L', _sqlite3.__file__])
        print()
        print('=== find_library ===')
        path = ctypes.util.find_library('sqlite3')
        print(f'  find_library(\"sqlite3\") = {path!r}')
        print()
        print('=== dlopen probe ===')
        from ctypes import CDLL
        from os import RTLD_GLOBAL
        lib_via_find = CDLL(path, mode=RTLD_GLOBAL)
        lib_via_ext = CDLL(_sqlite3.__file__, mode=RTLD_GLOBAL)
        print(f'  CDLL(find_library) handle: {lib_via_find._handle:#x}')
        print(f'  CDLL(_sqlite3.__file__) handle: {lib_via_ext._handle:#x}')
        print()
        print('=== symbol addresses ===')
        for name in ['sqlite3_open', 'sqlite3_errmsg', 'sqlite3_changes']:
            addr_find = ctypes.cast(getattr(lib_via_find, name, None), ctypes.c_void_p).value
            addr_ext = ctypes.cast(getattr(lib_via_ext, name, None), ctypes.c_void_p).value
            match = 'SAME' if addr_find == addr_ext else 'DIFFERENT'
            print(f'  {name}: find_library={addr_find:#x} _sqlite3={addr_ext:#x} [{match}]')
        print()
        print('=== sqlite3 versions ===')
        ver_find = ctypes.c_char_p(lib_via_find.sqlite3_libversion()).value
        ver_ext = ctypes.c_char_p(lib_via_ext.sqlite3_libversion()).value
        print(f'  find_library sqlite: {ver_find}')
        print(f'  _sqlite3.so sqlite:  {ver_ext}')
        print(f'  match: {ver_find == ver_ext}')
        print()
        print('=== llvmlite dlsym(RTLD_DEFAULT) ===')
        from llvmlite import binding as ll
        for name in ['sqlite3_open', 'sqlite3_errmsg', 'sqlite3_changes']:
            addr = ll.address_of_symbol(name)
            print(f'  {name}: {addr:#x}' if addr else f'  {name}: None')
        "
    - name: Lint with flake8
      run: flake8 . --count --show-source --statistics
    - name: Test with pytest
      run: |
        pytest --durations=20 --cov=numbox --cov-report=term-missing
    - name: Install build dependencies
      run: |
        pip install build==1.2.2.post1 wheel==0.45.0
    - name: Build wheel
      run: |
        git clean -Xfd
        python -m build --wheel
