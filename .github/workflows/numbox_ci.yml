name: numbox_ci

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        numba-version: [ "0.65.1" ]
        arch: [ "ubuntu-latest", "ubuntu-24.04-arm", "windows-latest" ]
        exclude:
          - arch: "windows-latest"
            python-version: "3.11"
          - arch: "windows-latest"
            python-version: "3.12"
          - arch: "windows-latest"
            python-version: "3.13"
        include:
          # min numba for 3.10-3.12 (0.60.0)
          - python-version: "3.10"
            numba-version: "0.60.0"
            arch: "ubuntu-latest"
          - python-version: "3.10"
            numba-version: "0.60.0"
            arch: "ubuntu-24.04-arm"
          - python-version: "3.10"
            numba-version: "0.60.0"
            arch: "windows-latest"
          - python-version: "3.11"
            numba-version: "0.60.0"
            arch: "ubuntu-latest"
          - python-version: "3.11"
            numba-version: "0.60.0"
            arch: "ubuntu-24.04-arm"
          - python-version: "3.12"
            numba-version: "0.60.0"
            arch: "ubuntu-latest"
          - python-version: "3.12"
            numba-version: "0.60.0"
            arch: "ubuntu-24.04-arm"
          # min numba for 3.13 (0.61.0)
          - python-version: "3.13"
            numba-version: "0.61.0"
            arch: "ubuntu-latest"
          - python-version: "3.13"
            numba-version: "0.61.0"
            arch: "ubuntu-24.04-arm"
          # min numba for 3.14 (0.63.0)
          - python-version: "3.14"
            numba-version: "0.63.0"
            arch: "ubuntu-latest"
          - python-version: "3.14"
            numba-version: "0.63.0"
            arch: "ubuntu-24.04-arm"
          - python-version: "3.14"
            numba-version: "0.63.0"
            arch: "windows-latest"
          # macOS
          - python-version: "3.14"
            numba-version: "0.65.1"
            arch: "macos-latest"
    runs-on: "${{ matrix.arch }}"

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Determine version
      shell: bash
      id: version
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          BUILD_VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
        fi
    - name: Write version to __init__.py
      shell: bash
      run: echo "__version__ = '${{ env.VERSION }}'" > numbox/__init__.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        pip install "numba==${{ matrix.numba-version }}"
        pip install -e .
    - name: Lint with flake8
      run: flake8 . --count --show-source --statistics
    - name: Test with pytest
      run: |
        pytest --durations=20 --cov=numbox --cov-report=term-missing
    - name: Install build dependencies
      run: |
        pip install build==1.2.2.post1 wheel==0.45.0
    - name: Build wheel
      run: |
        git clean -Xfd
        python -m build --wheel
