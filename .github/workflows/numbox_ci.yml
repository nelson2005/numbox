name: numbox_ci

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        # DEBUG: Homebrew-only — reproduce Goykhman's scenario
        include:
          - python-version: "3.14"
            numba-version: "0.65.1"
            arch: "macos-latest"
            python-source: "homebrew"
    runs-on: "${{ matrix.arch }}"

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python (framework)
      if: matrix.python-source != 'homebrew'
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Set up Python (Homebrew)
      if: matrix.python-source == 'homebrew'
      run: |
        brew install python@${{ matrix.python-version }}
        brew link --overwrite python@${{ matrix.python-version }}
        echo "/opt/homebrew/opt/python@${{ matrix.python-version }}/libexec/bin" >> $GITHUB_PATH
        echo "/opt/homebrew/opt/python@${{ matrix.python-version }}/bin" >> $GITHUB_PATH
    - name: Verify Homebrew Python
      if: matrix.python-source == 'homebrew'
      run: |
        which python3
        python3 -c "import sys; print(sys.executable)"
        python3 -c "import _sqlite3; print(_sqlite3.__file__)"
    - name: Determine version
      shell: bash
      id: version
      run: |
        if [ "${{ github.ref_type }}" == "tag" ]; then
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        else
          BUILD_VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
        fi
    - name: Write version to __init__.py
      shell: bash
      run: echo "__version__ = '${{ env.VERSION }}'" > numbox/__init__.py
    - name: Create venv (Homebrew)
      if: matrix.python-source == 'homebrew'
      run: |
        python3 -m venv venv
        echo "$PWD/venv/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        pip install "numba==${{ matrix.numba-version }}"
        pip install -e .
    - name: macOS sqlite library investigation
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "===== TEST 1: baseline — what is where ====="
        python3 -u -c "
        import ctypes, ctypes.util, os, subprocess, sys, sqlite3, _sqlite3
        F = sys.stdout.flush
        print(f'python: {sys.executable}'); F()
        print(f'_sqlite3.so: {_sqlite3.__file__}'); F()
        print(f'python sqlite version: {sqlite3.sqlite_version}'); F()
        subprocess.run(['otool', '-L', _sqlite3.__file__]); F()
        path = ctypes.util.find_library('sqlite3')
        print(f'find_library: {path!r}'); F()
        " || echo "TEST 1 CRASHED"
        echo ""

        echo "===== TEST 2: ctypes getattr vs llvmlite address_of_symbol — no RTLD_GLOBAL ====="
        python3 -u -c "
        import ctypes, ctypes.util, os, sys
        F = sys.stdout.flush
        from llvmlite import binding as ll
        for name in ['sqlite3_open', 'sqlite3_changes']:
            addr = ll.address_of_symbol(name)
            print(f'before any load — address_of_symbol({name}): {addr}'); F()
        " || echo "TEST 2 CRASHED"
        echo ""

        echo "===== TEST 3: load system sqlite (find_library) with RTLD_GLOBAL ====="
        python3 -u -c "
        import ctypes, ctypes.util, os, sys
        F = sys.stdout.flush
        from llvmlite import binding as ll
        path = ctypes.util.find_library('sqlite3')
        print(f'loading {path} with RTLD_GLOBAL'); F()
        lib = ctypes.CDLL(path, mode=os.RTLD_GLOBAL)
        print(f'handle: {lib._handle:#x}'); F()
        lib.sqlite3_libversion.restype = ctypes.c_char_p
        lib.sqlite3_libversion.argtypes = []
        print(f'version via ctypes getattr: {lib.sqlite3_libversion()}'); F()
        for name in ['sqlite3_open', 'sqlite3_changes']:
            f = getattr(lib, name, None)
            ctypes_addr = ctypes.cast(f, ctypes.c_void_p).value if f else None
            ll_addr = ll.address_of_symbol(name)
            ca = f'{ctypes_addr:#x}' if ctypes_addr else 'None'
            la = f'{ll_addr:#x}' if ll_addr else 'None'
            print(f'{name}: ctypes={ca} llvmlite={la}'); F()
        " || echo "TEST 3 CRASHED"
        echo ""

        echo "===== TEST 4: load _sqlite3.so with RTLD_GLOBAL ====="
        python3 -u -c "
        import ctypes, os, sys, _sqlite3
        F = sys.stdout.flush
        from llvmlite import binding as ll
        print(f'loading {_sqlite3.__file__} with RTLD_GLOBAL'); F()
        lib = ctypes.CDLL(_sqlite3.__file__, mode=os.RTLD_GLOBAL)
        print(f'handle: {lib._handle:#x}'); F()
        for name in ['sqlite3_open', 'sqlite3_changes']:
            f = getattr(lib, name, None)
            ctypes_addr = ctypes.cast(f, ctypes.c_void_p).value if f else None
            ll_addr = ll.address_of_symbol(name)
            ca = f'{ctypes_addr:#x}' if ctypes_addr else 'None'
            la = f'{ll_addr:#x}' if ll_addr else 'None'
            print(f'{name}: ctypes={ca} llvmlite={la}'); F()
        " || echo "TEST 4 CRASHED"
        echo ""

        echo "===== TEST 5: load Homebrew sqlite by full path with RTLD_GLOBAL ====="
        python3 -u -c "
        import ctypes, os, sys
        F = sys.stdout.flush
        from llvmlite import binding as ll
        brew_path = '/opt/homebrew/opt/sqlite/lib/libsqlite3.dylib'
        print(f'loading {brew_path} with RTLD_GLOBAL'); F()
        lib = ctypes.CDLL(brew_path, mode=os.RTLD_GLOBAL)
        print(f'handle: {lib._handle:#x}'); F()
        lib.sqlite3_libversion.restype = ctypes.c_char_p
        lib.sqlite3_libversion.argtypes = []
        print(f'version via ctypes getattr: {lib.sqlite3_libversion()}'); F()
        for name in ['sqlite3_open', 'sqlite3_changes']:
            f = getattr(lib, name, None)
            ctypes_addr = ctypes.cast(f, ctypes.c_void_p).value if f else None
            ll_addr = ll.address_of_symbol(name)
            ca = f'{ctypes_addr:#x}' if ctypes_addr else 'None'
            la = f'{ll_addr:#x}' if ll_addr else 'None'
            print(f'{name}: ctypes={ca} llvmlite={la}'); F()
        " || echo "TEST 5 CRASHED"
        echo ""

        echo "===== TEST 6: call each library's sqlite3_changes on a Python connection ptr ====="
        python3 -u -c "
        import ctypes, ctypes.util, os, sys, sqlite3
        F = sys.stdout.flush
        import _sqlite3
        from numbox.utils.pysqlite_bridge import _PysqliteConnection
        conn = sqlite3.connect(':memory:')
        conn.execute('CREATE TABLE t(x INT)')
        conn.execute('INSERT INTO t VALUES (42)')
        conn.commit()
        db_ptr = _PysqliteConnection.from_address(id(conn)).db
        print(f'db_ptr: {db_ptr:#x}'); F()
        print(f'python sqlite version: {sqlite3.sqlite_version}'); F()
        print(); F()
        brew_path = '/opt/homebrew/opt/sqlite/lib/libsqlite3.dylib'
        sys_path = ctypes.util.find_library('sqlite3')
        for label, path in [('homebrew', brew_path), ('system', sys_path), ('_sqlite3.so', _sqlite3.__file__)]:
            print(f'--- {label}: {path} ---'); F()
            try:
                lib = ctypes.CDLL(path, mode=os.RTLD_GLOBAL)
                lib.sqlite3_libversion.restype = ctypes.c_char_p
                lib.sqlite3_libversion.argtypes = []
                print(f'  version: {lib.sqlite3_libversion()}'); F()
                lib.sqlite3_changes.restype = ctypes.c_int
                lib.sqlite3_changes.argtypes = [ctypes.c_void_p]
                print(f'  calling sqlite3_changes(db_ptr)...'); F()
                result = lib.sqlite3_changes(db_ptr)
                print(f'  result: {result}'); F()
            except Exception as e:
                print(f'  exception: {e}'); F()
        conn.close()
        " || echo "TEST 6 CRASHED (segfault calling cross-library function)"
        echo ""

        echo "===== INVESTIGATION COMPLETE ====="
    - name: Lint with flake8
      run: flake8 . --count --show-source --statistics
    - name: Test with pytest
      run: |
        pytest --durations=20 --cov=numbox --cov-report=term-missing
    - name: Install build dependencies
      run: |
        pip install build==1.2.2.post1 wheel==0.45.0
    - name: Build wheel
      run: |
        git clean -Xfd
        python -m build --wheel
