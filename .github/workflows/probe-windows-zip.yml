name: probe-windows-zip

on:
  push:
    branches: [ "probe/**" ]

permissions:
  contents: read

jobs:
  zip-import:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        numba: ["0.68.0", "0.67.0"]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install numba ${{ matrix.numba }} and numbox at e7c4857, the follow-up on the fork
      run: python -m pip install "numba==${{ matrix.numba }}" "https://github.com/nelson2005/numbox/archive/e7c4857df59df0ffbbb32b2c4b82020092d78840.tar.gz"
    - name: Import numbox from a zip holding every .py
      run: python probes/zip_import.py sources
    - name: Import numbox from a zip whose bindings are .pyc only
      run: python probes/zip_import.py pyc
